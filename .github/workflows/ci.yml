name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check version entry point
        run: python -m agent_learning_loop --version

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src tests

      - name: Test
        run: python -m pytest -q

      - name: Run M1 Workspace smoke test
        run: >-
          python -m agent_learning_loop run-workspace
          --task all
          --output-dir "$RUNNER_TEMP/m1-smoke"

      - name: Build distributions
        run: python -m build --no-isolation
