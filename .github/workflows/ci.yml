name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check version entry point
        run: python -m agent_learning_loop --version

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src tests

      - name: Test
        run: python -m pytest -q

      - name: Validate packaged corpus
        run: python -m agent_learning_loop validate-corpus

      - name: Validate packaged Incident corpus
        run: python -m agent_learning_loop validate-corpus --environment incident

      - name: Validate packaged DataOps and all corpora
        run: |
          python -m agent_learning_loop validate-corpus --environment dataops
          python -m agent_learning_loop validate-corpus --environment all

      - name: Run Workspace corpus smoke test
        run: >-
          python -m agent_learning_loop run-workspace
          --task all
          --output-dir "$RUNNER_TEMP/m1-smoke"

      - name: Run Incident corpus smoke test
        run: >-
          python -m agent_learning_loop run-incident
          --task all
          --output-dir "$RUNNER_TEMP/m4b-incident-smoke"

      - name: Run DataOps corpus smoke test
        run: >-
          python -m agent_learning_loop run-dataops
          --task all
          --output-dir "$RUNNER_TEMP/m4c-dataops-smoke"

      - name: Run M2 safeguarded failure smoke test
        run: >-
          python -m agent_learning_loop run-runtime
          --task workspace.build-summary
          --mode safeguarded
          --failure-schedule workspace.transient-read.v1
          --output-dir "$RUNNER_TEMP/m2-smoke"

      - name: Run M3A interrupt and resume smoke test
        shell: bash
        run: |
          set +e
          python -m agent_learning_loop run-durable \
            --task workspace.fix-config \
            --mode safeguarded \
            --failure-schedule workspace.lost-write-result.v1 \
            --interruption-schedule workspace.post-write-boundary.v1 \
            --checkpointing on \
            --output-dir "$RUNNER_TEMP/m3a-smoke"
          interrupted=$?
          set -e
          test "$interrupted" -eq 6
          python -m agent_learning_loop resume-runtime \
            --run-dir "$RUNNER_TEMP/m3a-smoke"
          python -m agent_learning_loop validate-trajectory \
            --run-dir "$RUNNER_TEMP/m3a-smoke"

      - name: Run M3B reference replay smoke test
        run: |
          python -m agent_learning_loop run-durable \
            --task workspace.fix-config \
            --mode safeguarded \
            --failure-schedule workspace.lost-write-result.v1 \
            --checkpointing off \
            --record-actions on \
            --output-dir "$RUNNER_TEMP/m3b-source"
          python -m agent_learning_loop replay-actions \
            --source-run-dir "$RUNNER_TEMP/m3b-source" \
            --output-dir "$RUNNER_TEMP/m3b-replay"

      - name: Run and read-only validate the fixed M5A Eval matrix
        run: |
          python -m agent_learning_loop run-eval \
            --suite all \
            --source-commit "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/m5a-eval"
          python -m agent_learning_loop validate-eval \
            --run-dir "$RUNNER_TEMP/m5a-eval"

      - name: Export and read-only validate M7A scripted-oracle candidates
        shell: bash
        run: |
          set -euo pipefail
          source_eval="$RUNNER_TEMP/m7a-source-eval"
          first="$RUNNER_TEMP/m7a-candidate-first"
          second="$RUNNER_TEMP/m7a-candidate-second"
          source_before="$RUNNER_TEMP/m7a-source-before.json"
          python -m agent_learning_loop run-eval \
            --suite system-correctness \
            --source-commit "$GITHUB_SHA" \
            --output-dir "$source_eval"
          python - "$source_eval" "$source_before" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          inventory = {
              path.relative_to(source).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in source.rglob("*")
              if path.is_file()
          }
          pathlib.Path(sys.argv[2]).write_text(
              json.dumps(inventory, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
              newline="\n",
          )
          PY
          python -m agent_learning_loop export-sft-candidates \
            --eval-bundle "$source_eval" \
            --output-dir "$first"
          python -m agent_learning_loop export-sft-candidates \
            --eval-bundle "$source_eval" \
            --output-dir "$second"
          python -m agent_learning_loop validate-sft-candidates \
            --bundle "$first" \
            --eval-bundle "$source_eval"
          python - "$source_eval" "$source_before" "$first" "$second" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          before = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          after = {
              path.relative_to(source).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in source.rglob("*")
              if path.is_file()
          }

          def inventory(root: pathlib.Path) -> dict[str, bytes]:
              return {
                  path.relative_to(root).as_posix(): path.read_bytes()
                  for path in root.rglob("*")
                  if path.is_file()
              }

          first = inventory(pathlib.Path(sys.argv[3]))
          second = inventory(pathlib.Path(sys.argv[4]))
          assert before == after
          assert first == second
          assert set(first) == {
              "dataset-manifest.json",
              "samples.jsonl",
              "quality-report.json",
              "report.md",
          }
          manifest = json.loads(first["dataset-manifest.json"])
          quality = json.loads(first["quality-report.json"])
          assert manifest["sample_count"] == 18
          assert manifest["environment_counts"] == {
              "workspace": 6,
              "incident": 6,
              "dataops": 6,
          }
          assert manifest["held_out_excluded"] == {"validation": 6, "test": 6}
          assert quality["execution_calls"] == 0
          assert quality["model_generated_samples"] == 0
          assert quality["preference_pairs"] == 0
          PY

      - name: Validate committed canonical M7 SFT candidate
        shell: bash
        run: |
          set -euo pipefail
          committed="datasets/sft-development-v1/candidate"
          source_eval="$RUNNER_TEMP/m7b-source-eval"
          fresh="$RUNNER_TEMP/m7b-fresh-candidate"
          source_before="$RUNNER_TEMP/m7b-source-before.json"
          python -m agent_learning_loop run-eval \
            --suite system-correctness \
            --source-commit 8a4016a9c154238cd7e5df5d1a3ed8fd194dd10d \
            --output-dir "$source_eval"
          python - "$source_eval" "$source_before" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          inventory = {
              path.relative_to(source).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in source.rglob("*")
              if path.is_file()
          }
          pathlib.Path(sys.argv[2]).write_text(
              json.dumps(inventory, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
              newline="\n",
          )
          PY
          python -m agent_learning_loop validate-sft-candidates \
            --bundle "$committed" \
            --eval-bundle "$source_eval"
          python -m agent_learning_loop export-sft-candidates \
            --eval-bundle "$source_eval" \
            --output-dir "$fresh"
          python - "$source_eval" "$source_before" "$committed" "$fresh" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          before = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          after = {
              path.relative_to(source).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in source.rglob("*")
              if path.is_file()
          }

          def inventory(root: pathlib.Path) -> dict[str, bytes]:
              return {
                  path.relative_to(root).as_posix(): path.read_bytes()
                  for path in root.rglob("*")
                  if path.is_file()
              }

          committed = inventory(pathlib.Path(sys.argv[3]))
          fresh = inventory(pathlib.Path(sys.argv[4]))
          assert before == after
          assert committed == fresh
          assert set(committed) == {
              "dataset-manifest.json",
              "samples.jsonl",
              "quality-report.json",
              "report.md",
          }
          assert sum(map(len, committed.values())) == 60_967
          assert all(b"\r" not in payload for payload in committed.values())
          manifest = json.loads(committed["dataset-manifest.json"])
          quality = json.loads(committed["quality-report.json"])
          assert manifest["source_commit"] == "8a4016a9c154238cd7e5df5d1a3ed8fd194dd10d"
          assert manifest["sample_count"] == 18
          assert manifest["environment_counts"] == {
              "workspace": 6,
              "incident": 6,
              "dataops": 6,
          }
          assert manifest["held_out_excluded"] == {"validation": 6, "test": 6}
          assert quality["execution_calls"] == 0
          assert quality["model_generated_samples"] == 0
          assert quality["preference_pairs"] == 0
          assert quality["source_bytes_unchanged"] is True
          PY

      - name: Run deterministic M7C-A validation next-action probe
        shell: bash
        run: |
          set -euo pipefail
          source_eval="$RUNNER_TEMP/m7ca-source-eval"
          probe="$RUNNER_TEMP/m7ca-fake-probe"
          source_commit="$(
            python -c \
              'from agent_learning_loop.model_probe_specs import load_probe_contract; print(load_probe_contract().public_source_commit)'
          )"
          python -m agent_learning_loop run-eval \
            --suite system-correctness \
            --split validation \
            --source-commit "$source_commit" \
            --output-dir "$source_eval"
          python -m agent_learning_loop run-model-probe \
            --eval-bundle "$source_eval" \
            --output-dir "$probe" \
            --backend fake
          python -m agent_learning_loop validate-model-probe \
            --bundle "$probe" \
            --eval-bundle "$source_eval"
          python - "$probe/summary.json" <<'PY'
          import json
          import pathlib
          import sys

          summary = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert summary["task_total"] == 6
          assert summary["prefix_total"] == 21
          assert summary["environment_task_counts"] == {
              "workspace": 2,
              "incident": 2,
              "dataops": 2,
          }
          assert summary["exact_match_prefixes"] == 21
          assert summary["all_prefix_exact_tasks"] == 6
          assert summary["execution_calls"] == 0
          PY

      - name: Validate committed canonical v0.1 evidence
        run: >-
          python -m agent_learning_loop validate-eval
          --run-dir reports/v0.1/eval-bundle

      - name: Run and read-only validate the simulated M6A pilot
        run: |
          python -m agent_learning_loop run-fde-case \
            --case incident-copilot-v1 \
            --source-commit "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/m6a-pilot"
          python -m agent_learning_loop validate-fde-case \
            --run-dir "$RUNNER_TEMP/m6a-pilot"
          python - "$RUNNER_TEMP/m6a-pilot/acceptance.json" <<'PY'
          import json
          import pathlib
          import sys

          acceptance = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert acceptance["registered_contracts"]["numerator"] == 10
          assert acceptance["held_out_contracts"]["numerator"] == 4
          assert acceptance["control_groups"]["numerator"] == 3
          assert acceptance["incident_safety"]["numerator"] == 10
          assert acceptance["unauthorized_high_impact_executions"]["count"] == 0
          assert {
              acceptance["real_customer_adoption"],
              acceptance["manual_baseline_time"],
              acceptance["roi"],
              acceptance["sla"],
              acceptance["production_latency"],
              acceptance["model_performance"],
          } == {"N/A"}
          PY

      - name: Validate committed canonical M6 simulated pilot
        shell: bash
        run: |
          set -euo pipefail
          committed="case_studies/incident_copilot/pilot-evidence"
          fresh="$RUNNER_TEMP/m6b-canonical-reproduction"
          python - "$committed" <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])

          def inventory(path: pathlib.Path) -> dict[str, bytes]:
              return {
                  item.relative_to(path).as_posix(): item.read_bytes()
                  for item in path.rglob("*")
                  if item.is_file()
              }

          before = inventory(root)
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "agent_learning_loop",
                  "validate-fde-case",
                  "--run-dir",
                  str(root),
              ],
              check=True,
          )
          after = inventory(root)
          assert before == after
          assert len(before) == 37
          manifest = json.loads(before["case-manifest.json"])
          acceptance = json.loads(before["acceptance.json"])
          assert manifest["source_commit"] == "a808ab5ee1b9420cfcc3a1f585e2b94491d7cdaa"
          assert len(manifest["evidence_artifacts"]) == 34
          assert len(
              [path for path in manifest["evidence_artifacts"] if path["path"].startswith("runs/")]
          ) == 30
          assert acceptance["registered_contracts"]["numerator"] == 10
          assert acceptance["held_out_contracts"]["numerator"] == 4
          assert acceptance["control_groups"]["numerator"] == 3
          assert acceptance["incident_safety"]["numerator"] == 10
          assert acceptance["unauthorized_high_impact_executions"]["count"] == 0
          assert acceptance["overall"] == "accepted"
          print("committed-directory-sha256", hashlib.sha256(b"".join(before[key] for key in sorted(before))).hexdigest())
          PY
          python -m agent_learning_loop run-fde-case \
            --case incident-copilot-v1 \
            --source-commit a808ab5ee1b9420cfcc3a1f585e2b94491d7cdaa \
            --output-dir "$fresh"
          python - "$committed" "$fresh" <<'PY'
          import pathlib
          import sys

          def inventory(path: pathlib.Path) -> dict[str, bytes]:
              return {
                  item.relative_to(path).as_posix(): item.read_bytes()
                  for item in path.rglob("*")
                  if item.is_file()
              }

          committed = inventory(pathlib.Path(sys.argv[1]))
          fresh = inventory(pathlib.Path(sys.argv[2]))
          assert len(committed) == len(fresh) == 37
          assert committed == fresh
          PY

      - name: Build distributions
        run: python -m build --no-isolation
