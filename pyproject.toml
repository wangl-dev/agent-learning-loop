[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-learning-loop"
version = "0.1.0.dev0"
description = "A reproducible foundation for controlled agent learning experiments."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "wangl-dev" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "setuptools>=77",
]

[project.scripts]
agent-learning-loop = "agent_learning_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_learning_loop = [
  "py.typed",
  "task_fixtures/workspace/*.json",
  "task_fixtures/incident/*.json",
  "task_fixtures/dataops/*.json",
  "failure_schedules/*.json",
  "interruption_schedules/*.json",
  "action_catalogs/*.json",
  "action_catalogs/incident/*.json",
  "action_catalogs/dataops/*.json",
  "task_manifests/workspace/*.json",
  "task_manifests/incident/*.json",
  "task_manifests/dataops/*.json",
  "eval_suites/*.json",
  "fde_cases/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
